<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening Shokureki…</title>
  </head>
  <body>
    <script>
      (() => {
        const basePath = "/shokureki/";
        const route = window.location.pathname.startsWith(basePath)
          ? window.location.pathname.slice(basePath.length)
          : "";
        window.location.replace(`${basePath}?route=${encodeURIComponent(route)}${window.location.hash}`);
      })();
    </script>
  </body>
</html>
